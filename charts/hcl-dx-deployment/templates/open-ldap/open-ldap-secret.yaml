# This template creates:
# Resources: Secret for admin user
# For Service: open-ldap

{{- if eq (include "hcl-dx-deployment.openLdapEnabled" .) "true" }}

# Initialize all variables with the default value
{{- $username := "" -}}
{{- $password := "" -}}

# Check if a custom secret is used and validate secret name and data
{{- if (eq (include "hcl-dx-deployment.isCustomLdapSecretUsed" .) "false") }}
  # Use  credential from values
  {{- $username = .Values.security.openLdap.ldapUser | b64enc | b64enc }}
  {{- $password = .Values.security.openLdap.ldapPassword | b64enc | b64enc }}
{{- else }}
  # Lookup the credentials in the custom secret
  {{- $ldapCustomSecret := (lookup "v1" "Secret" .Release.Namespace (.Values.security.openLdap.customLdapSecret)) }}
  {{- if $ldapCustomSecret }}
    {{- $username = (index $ldapCustomSecret.data "username") | b64enc }}
    {{- $password = (index $ldapCustomSecret.data "password") | b64enc }}
  {{- end -}}
{{- end }}

apiVersion: "v1"
kind: "Secret"
data:
  username: "{{$username}}"
  password: "{{$password}}"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-open-ldap-admin"
type: "Opaque"
{{- end }}
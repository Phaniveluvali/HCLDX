# This template creates:
# Resources: Secret for AI configuration
# For Service: WebEngine

{{- if eq (include "hcl-dx-deployment.webEngineEnabled" .) "true" }}

# Initialize variables with the default value
{{- $apiKey := "" -}}

# Check if a custom secret is used and validate secret name and data
{{- if (eq (include "hcl-dx-deployment.isCustomWebEngineContentAISecretUsed" .) "false") }}
  # Use credential from values
  {{- $apiKey = .Values.security.webEngine.webEngineContentAIProviderAPIKey | b64enc }}
{{- else }}
  # Lookup the credentials in the custom secret
  {{- $contentAICustomSecret := (lookup "v1" "Secret" .Release.Namespace (.Values.security.webEngine.customWebEngineContentAISecret)) }}
  {{- if $contentAICustomSecret }}
    {{- $apiKey = (index $contentAICustomSecret.data "apiKey") }}
  {{- end -}}
{{- end }}

apiVersion: "v1"
kind: "Secret"
data:
  apiKey: "{{$apiKey}}"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-web-engine-content-ai"
type: "Opaque"
{{- end }}
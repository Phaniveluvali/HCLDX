# This template creates:
# Resources: Secret for LDAP configuration
# For Service: WebEngine

{{- if eq (include "hcl-dx-deployment.webEngineEnabled" .) "true" }}
{{- if or (eq (include "hcl-dx-deployment.ldapWebEngineConfigurationEnabled" .) "true") .Values.applications.openLdap }}

{{- $bindUser := "" -}}
{{- $bindPassword := "" -}}

# We check if the respective custom secret is used either for DX LDAP or an "other" LDAP
{{- if or (and (eq .Values.configuration.webEngine.ldap.type "dx") .Values.security.openLdap.customLdapSecret) (and (eq .Values.configuration.webEngine.ldap.type "other") .Values.configuration.webEngine.ldap.customLdapSecret) }}
  {{- $bindUser = include "hcl-dx-deployment.customSecretWebEngineLdapConfigurationBindUser" . | b64enc -}}
  {{- $bindPassword = include "hcl-dx-deployment.customSecretWebEngineLdapConfigurationBindPassword" .  -}}
{{- else }}
  {{- $bindUser = include "hcl-dx-deployment.ldapWebEngineConfigurationBindUser" . | b64enc  -}}
  {{- $bindPassword = include "hcl-dx-deployment.ldapWebEngineConfigurationBindPassword" . | b64enc  -}}
{{- end }}

apiVersion: "v1"
kind: "Secret"
data:
  bindUser: "{{$bindUser}}"
  bindPassword: "{{$bindPassword}}"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-web-engine-ldap"
type: "Opaque"

{{- end }}
{{- end }}

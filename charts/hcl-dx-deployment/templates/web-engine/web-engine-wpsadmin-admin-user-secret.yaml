# Get generate random password for fresh install
{{- $passwordText := "" -}}
{{- if ( .Release.IsInstall) }}
  {{- $passwordText = include "hcl-dx-deployment.generateRandomPassword" (dict "length" 25) | b64enc }}
{{- end -}}

# This Helm template creates a Kubernetes Secret for the `wpsadmin` user.
# The Secret is only created if either the web engine is enabled
{{- if or (eq (include "hcl-dx-deployment.webEngineEnabled" .) "true") }}
---
# This template creates:
# Resources: Secret for wpsadmin user
# For Service: WebEngine
# Initialize all variables with the default value
{{- $default := "" -}}
{{- $username := $default -}}
{{- $password := $default -}}

# Check if a custom secret is used and validate secret name and data
{{- if (eq (include "hcl-dx-deployment.iscustomWebEngineSecretUsed" .) "false") }}
  {{- if and (.Values.security.webEngine.webEngineUser) (.Values.security.webEngine.webEnginePassword) }}
    # Use  credential from values
    {{- $username = .Values.security.webEngine.webEngineUser | b64enc }}
    {{- $password = .Values.security.webEngine.webEnginePassword | b64enc }}
  # This is only applicable in case of install
  {{- else if and ( .Release.IsInstall) (.Values.security.webEngine.webEngineUser) (not .Values.security.webEngine.webEnginePassword) }}
    {{- $username = .Values.security.webEngine.webEngineUser | b64enc }}
    {{- $password = $passwordText }}
  {{- else -}}
    {{- $webEngineWpsSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-web-engine-wps" .Release.Name)) }}
    {{- if $webEngineWpsSecret }}
      {{- $username = (index $webEngineWpsSecret.data "username") }}
      {{- $password = (index $webEngineWpsSecret.data "password") }}
    {{- end -}}
  {{- end -}}
  {{- else }}
  # Lookup the credentials in the custom secret
  {{- $wpsCustomSecret := (lookup "v1" "Secret" .Release.Namespace (.Values.security.webEngine.customWebEngineSecret)) }}
  {{- if and $wpsCustomSecret (not (empty $wpsCustomSecret.data)) }}
    {{- $username = (index $wpsCustomSecret.data "username") }}
    {{- $password = (index $wpsCustomSecret.data "password")  }}
  {{- end -}}
{{- end }}

apiVersion: "v1"
kind: "Secret"
data:
  username: "{{"wpsadmin" | b64enc}}"
  password: "{{$password}}"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-web-engine-wps"
type: "Opaque"

{{- end }}
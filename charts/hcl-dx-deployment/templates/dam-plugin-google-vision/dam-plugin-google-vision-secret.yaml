# This template creates:
# Resources: Secret for DAM Google Vision plugin API
# For Service: dam-plugin-google-vision

{{- if eq (include "hcl-dx-deployment.damPluginGoogleVisionEnabled" .) "true" }}

# Initialize all variables with the default value
{{- $authKey := "" -}}
{{- $apiKey := "" -}}

# Check if a custom secret is used and validate secret name and data
{{- if (eq (include "hcl-dx-deployment.isCustomDamGoogleVisionSecretUsed" .) "false") }}
  # Use  credential from values
  {{- $authKey = .Values.security.damPluginGoogleVision.authenticationKey | b64enc }}
  {{- $apiKey = .Values.security.damPluginGoogleVision.apiKey | b64enc }}
{{- else }}
  # Lookup the credentials in the custom secret
  {{- $damGoogleVisionCustomSecret := (lookup "v1" "Secret" .Release.Namespace (.Values.security.damPluginGoogleVision.customDamGoogleVisionSecret)) }}
  {{- if $damGoogleVisionCustomSecret }}
    {{- $authKey = (index $damGoogleVisionCustomSecret.data "authenticationKey") }}
    {{- $apiKey = (index $damGoogleVisionCustomSecret.data "apiKey") }}
  {{- end -}}
{{- end }}

apiVersion: "v1"
kind: "Secret"
data:
  authenticationKey: "{{$authKey}}"
  apiKey: "{{$apiKey}}"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-dam-plugin-google-vision-authentication"
type: "Opaque"
{{- end }}
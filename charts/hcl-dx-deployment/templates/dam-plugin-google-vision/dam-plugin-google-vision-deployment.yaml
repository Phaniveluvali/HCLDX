# This template creates:
# Resources: Deployment incl. Pods
# For Service: DAM Plugin Google Vision

{{- if eq (include "hcl-dx-deployment.damPluginGoogleVisionEnabled" .) "true" }}

apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "{{ .Release.Name }}-dam-plugin-google-vision"
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
spec:
  {{- if (.Values.scaling) }}
  {{- if (.Values.scaling.replicas) }}
  replicas: {{ .Values.scaling.replicas.damPluginGoogleVision }}
  {{- end }}
  {{- end }}
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-dam-plugin-google-vision"
  template:
    metadata:
      annotations: 
      {{- if (.Values.annotations.pod.damPluginGoogleVision) }}
      {{- range $customAnnotationValue := .Values.annotations.pod.damPluginGoogleVision }}
        {{ $customAnnotationValue.key }} : {{ $customAnnotationValue.value | quote }}
      {{- end }}
      {{- end }}
        checksum/config-dam-plugin-google-vision: "{{- include "hcl-dx-deployment.damPluginGoogleVisionConfig" . | sha256sum }}"
        checksum/auth-secret-dam-plugin-google-vision: {{ .Values.security.damPluginGoogleVision.authenticationKey | sha256sum }}
        checksum/api-key-dam-plugin-google-vision: {{ .Values.security.damPluginGoogleVision.apiKey | sha256sum }}
        {{- if and (.Values.metrics.damPluginGoogleVision.scrape) (eq (.Values.metrics.damPluginGoogleVision.prometheusDiscoveryType) "annotation") }}
        prometheus.io/scrape: "true"
        prometheus.io/path: "/probe/metrics"
        prometheus.io/port: "{{ include "hcl-dx-deployment.ports.global.nodeApplication" . }}"
        {{- end }}
      labels:
      {{- if (.Values.labels.pod.damPluginGoogleVision) }}
      {{- range $customLabelValue := .Values.labels.pod.damPluginGoogleVision }}
        {{ $customLabelValue.key }} : {{ $customLabelValue.value | quote }}
      {{- end }}
      {{- end }}
        app: "{{ .Release.Name }}-dam-plugin-google-vision"
        # Using general labels, see _helpers.tpl
        {{- include "hcl-dx-deployment.labels" . | nindent 8 }}
    spec:
      {{- if not (empty (include "hcl-dx-deployment.serviceAccountName" .)) }}  
      # Service account for pod
      serviceAccountName: {{ include "hcl-dx-deployment.serviceAccountName" . }}
      {{- end }}
      {{- if (.Values.nodeSelector) }}
      {{- if (.Values.nodeSelector.damPluginGoogleVision)}}
      nodeSelector:
        {{- toYaml (.Values.nodeSelector.damPluginGoogleVision) | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if (.Values.affinity) }}
      {{- if (.Values.affinity.damPluginGoogleVision)}}
      affinity:
        {{- toYaml (.Values.affinity.damPluginGoogleVision) | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if (.Values.nodeName) }}
      {{- if (.Values.nodeName.damPluginGoogleVision)}}
      nodeName:
        {{- toYaml (.Values.nodeName.damPluginGoogleVision) | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if (.Values.tolerations) }}
      {{- if (.Values.tolerations.damPluginGoogleVision)}}
      tolerations:
        {{- toYaml (.Values.tolerations.damPluginGoogleVision) | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if (.Values.topologySpreadConstraints) }}
      {{- if (.Values.topologySpreadConstraints.damPluginGoogleVision)}}
      topologySpreadConstraints:
        {{- toYaml (.Values.topologySpreadConstraints.damPluginGoogleVision) | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- include "hcl-dx-deployment.imagePullSecret" . | nindent 6}}
      {{- if (.Values.hostAliases) }}
      {{- if (.Values.hostAliases.damPluginGoogleVision)}}
      hostAliases:
        {{- toYaml (.Values.hostAliases.damPluginGoogleVision) | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: "dam-plugin-google-vision"
          # Build the image attribute by using the repository and image tag
          {{- if (.Values.images.tags) }}
          image: "{{- include "hcl-dx-deployment.imageRepository" . }}/{{ .Values.images.names.damPluginGoogleVision }}:{{ .Values.images.tags.damPluginGoogleVision }}"
          {{- end }}
          # Adjust the image pull policy based on the CHart value
          {{- if (.Values.images) }}
          imagePullPolicy: "{{ .Values.images.pullPolicy }}"
          {{- end }}
          env:
          {{- if (.Values.environment.pod.damPluginGoogleVision) }}
          {{- range $customEnvironmentValue := .Values.environment.pod.damPluginGoogleVision }} 
            - name: {{ $customEnvironmentValue.name }} 
              value: {{ $customEnvironmentValue.value | quote }}
          {{- end }}
          {{- end }}
          {{- if (.Values.configuration.containerTimezone) }}
            - name: TZ
              value: {{ .Values.configuration.containerTimezone }}
          {{- end }}
            - name: "PORT_v1"
              value: "{{ include "hcl-dx-deployment.ports.global.nodeApplication" . }}"
            - name: "PLUGIN_API_AUTH_KEY"
              valueFrom:
                secretKeyRef:
                  key: "authenticationKey"
                  name: "{{ .Release.Name }}-dam-plugin-google-vision-authentication"
            - name: "VISION_API_KEY"
              valueFrom:
                secretKeyRef:
                  key: "apiKey"
                  name: "{{ .Release.Name }}-dam-plugin-google-vision-authentication"
            - name: "MAX_RESULTS"
              value: "{{ .Values.configuration.damPluginGoogleVision.maxResults | int }}"
            - name: "CONFIDENCE_PERCENTAGE"
              value: "{{ .Values.configuration.damPluginGoogleVision.confidencePercentage | int }}"
            - name: "STUB_MODE"
              value: "{{ include "hcl-dx-deployment.stubMode" . }}"
            - name: "MAINTENANCE_MODE"
              value: {{ .Values.maintenanceMode.damPluginGoogleVision | quote }}
          # Port exposure configuration
          ports:
            - name: "google-vision"
              containerPort: {{ include "hcl-dx-deployment.ports.global.nodeApplication" . }}
          # Liveness probe
          livenessProbe:
          {{- if (.Values.maintenanceMode.damPluginGoogleVision) }}
            exec:
              command:
                - "true"
          {{- else }}
            httpGet:
              path: "/probe/live"
              port: 3000
              scheme: "HTTP"
          {{- with .Values.probes.damPluginGoogleVision.livenessProbe }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          # Readiness probe
          readinessProbe:
          {{- if (.Values.maintenanceMode.damPluginGoogleVision) }}
            exec:
              command:
                - "true"
          {{- else }}
            httpGet:
              path: "/probe/ready"
              port: 3000
              scheme: "HTTP"
          {{- with .Values.probes.damPluginGoogleVision.readinessProbe }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- if and (.Values.resources) (.Values.resources.damPluginGoogleVision) }}
          resources:
            # Resource requests taken from value settings
            {{- if (.Values.resources.damPluginGoogleVision.requests) }}
            requests:
              cpu: "{{ .Values.resources.damPluginGoogleVision.requests.cpu }}"
              memory: "{{ .Values.resources.damPluginGoogleVision.requests.memory }}"
            {{- end }}
            # Resource limits taken from value settings
            {{- if (.Values.resources.damPluginGoogleVision.limits) }}
            limits:
              {{- if (.Values.resources.damPluginGoogleVision.limits.cpu) }}
              cpu: "{{ .Values.resources.damPluginGoogleVision.limits.cpu }}"
              {{- end }}
              {{- if (.Values.resources.damPluginGoogleVision.limits.memory) }}
              memory: "{{ .Values.resources.damPluginGoogleVision.limits.memory }}"
              {{- end }}
            {{- end }}
          {{- end }}
          volumeMounts:
          - name: "config"
            mountPath: "/etc/config"
          - name: "global-config"
            mountPath: "/etc/global-config"
      volumes:
        - name: "config"
          configMap:
            name: "{{ .Release.Name }}-dam-plugin-google-vision"
        - name: "global-config"
          configMap:
            name: "{{ .Release.Name }}-global"

{{- end }}

# This template creates:
# Resources: Secret for DAM Kaltura plugin API
# For Service: DAM Kaltura Plugin

{{- if eq (include "hcl-dx-deployment.damPluginKalturaEnabled" .) "true" }}

# Initialize all variables with the default value
{{- $authKey := "" -}}
{{- $secretKey := "" -}}

# Check if a custom secret is used and validate secret name and data
{{- if (eq (include "hcl-dx-deployment.isCustomDamKalturaSecretUsed" .) "false") }}
  # Use  credential from values
  {{- $authKey = .Values.security.damPluginKaltura.authenticationKey| b64enc }}
  {{- $secretKey = .Values.security.damPluginKaltura.secretKey | b64enc }}
{{- else }}
  # Lookup the credentials in the custom secret
  {{- $damKalturaCustomSecret := (lookup "v1" "Secret" .Release.Namespace (.Values.security.damPluginKaltura.customDamKalturaSecret)) }}
  {{- if $damKalturaCustomSecret }}
    {{- $authKey = (index $damKalturaCustomSecret.data "authenticationKey") }}
    {{- $secretKey = (index $damKalturaCustomSecret.data "secretKey") }}
  {{- end -}}
{{- end }}

apiVersion: "v1"
kind: "Secret"
data:
  authenticationKey: "{{$authKey}}"
  secretKey: "{{$secretKey}}"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-dam-plugin-kaltura-authentication"
type: "Opaque"
{{- end }}
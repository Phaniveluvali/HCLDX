# This template creates:
# Resources: Secret for wasadmin user
# For Service: Remote Search

{{- if eq (include "hcl-dx-deployment.remoteSearchEnabled" .) "true" }}

# Initialize all variables with the default value
{{- $default := "" -}}
{{- $username := $default -}}
{{- $password := $default -}}

# Check if a custom secret is used and validate secret name and data
{{- if (eq (include "hcl-dx-deployment.isCustomRemoteSearchSecretUsed" .) "false") }}
  {{- if and (.Values.security.remoteSearch.wasUser) (.Values.security.remoteSearch.wasPassword) }}
    # Use  credential from values
    {{- $username = .Values.security.remoteSearch.wasUser | b64enc | b64enc }}
    {{- $password = .Values.security.remoteSearch.wasPassword | b64enc | b64enc }}
  # This is only applicable in case of install
  {{- else if and ( .Release.IsInstall) (.Values.security.remoteSearch.wasUser) (not .Values.security.remoteSearch.wasPassword) }}
    {{- $username = .Values.security.remoteSearch.wasUser | b64enc | b64enc }}
    {{- $password = include "hcl-dx-deployment.generateRandomPassword" (dict "length" 25) | b64enc | b64enc }}
  {{- else -}}
    {{- $remoteSearchSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-remote-search-was" .Release.Name)) }}
    {{- if $remoteSearchSecret }}
      {{- $username = (index $remoteSearchSecret.data "username") }}
      {{- $password = (index $remoteSearchSecret.data "password") }}
    {{- end -}}
  {{- end -}}
{{- else }}
  # Lookup the credentials in the custom secret
  {{- $wasCustomSecret := (lookup "v1" "Secret" .Release.Namespace (.Values.security.remoteSearch.customWasSecret)) }}
  {{- if $wasCustomSecret }}
    {{- $username = (index $wasCustomSecret.data "username") | b64enc }}
    {{- $password = (index $wasCustomSecret.data "password") | b64enc }}
  {{- end -}}
{{- end }}

apiVersion: "v1"
kind: "Secret"
data:
  username: "{{$username}}"
  password: "{{$password}}"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-remote-search-was"
type: "Opaque"

{{- end }}
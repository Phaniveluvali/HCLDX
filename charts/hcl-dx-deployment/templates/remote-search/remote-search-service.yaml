# This template creates:
# Resources: Service
# For Service: remote-search

{{- if eq (include "hcl-dx-deployment.remoteSearchEnabled" .) "true" }}

apiVersion: "v1"
kind: "Service"
metadata:
  name: "{{ .Release.Name }}-remote-search"
  annotations: 
  {{- if (.Values.annotations.service.remoteSearch) }}
  {{- range $customAnnotationValue := .Values.annotations.service.remoteSearch }}
    {{ $customAnnotationValue.key }} : {{ $customAnnotationValue.value | quote }}
  {{- end }}
  {{- end }}
  labels:
    app: "{{ .Release.Name }}-remote-search"
  {{- if (.Values.labels.service.remoteSearch) }}
  {{- range $customLabelValue := .Values.labels.service.remoteSearch }}
    {{ $customLabelValue.key }} : {{ $customLabelValue.value | quote }}
  {{- end }}
  {{- end }}
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
spec:
  type: "ClusterIP"
  ports:
    - name: "was-admin"
      port: {{ include "hcl-dx-deployment.ports.remoteSearch.wasAdmin" . }}
    - name: "was-admin-sec"
      port: {{ include "hcl-dx-deployment.ports.remoteSearch.wasAdminSecure" . }}
    - name: "boot-port"
      port: {{ include "hcl-dx-deployment.ports.remoteSearch.boot" . }}
    - name: "rs-port"
      port: {{ include "hcl-dx-deployment.ports.remoteSearch.rs" . }}
  selector:
    app: "{{ .Release.Name }}-remote-search"

{{- end }}
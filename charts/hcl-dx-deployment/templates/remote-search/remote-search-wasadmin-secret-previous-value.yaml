# This template creates:
# Resources: Secret for wasadmin user with previous values
# For Service: Remote Search

{{- if eq (include "hcl-dx-deployment.remoteSearchEnabled" .) "true" }}

# The following logic keeps the last credentials stored to use in the password change process

# Initialize all variables with the default value ("wpsadmin"). This covers the first initial startup of remote search
{{- $default := "wpsadmin" | b64enc | b64enc -}}
{{- $username := $default -}}
{{- $password := $default -}}
{{- $wasActiveUsername := $default -}}
{{- $wasActivePassword := $default -}}
{{- $wasPreviousUsername := $default -}}
{{- $wasPreviousPassword := $default -}}

# Lookup the currently set credentials
{{- $wasActiveSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-remote-search-was" .Release.Name)) }}
{{- if $wasActiveSecret }}
  {{- $wasActiveUsername = (index $wasActiveSecret.data "username") }}
  {{- $wasActivePassword = (index $wasActiveSecret.data "password") }}
{{- end -}}

# Lookup the previously set credentials
{{- $wasPreviousSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-remote-search-was-previous-value" .Release.Name)) }}
{{- if $wasPreviousSecret -}}
  {{- $wasPreviousUsername = (index $wasPreviousSecret.data "username") }}
  {{- $wasPreviousPassword = (index $wasPreviousSecret.data "password") }}
{{- end }}

# If the value defined in the custom values is still the same as the currently set values, we keep the previous values the same
# If the values changed, we store the current values in the previous values secret
# This mechanism makes sure that multiple upgrades with the same values do not overwrite the previous credentials

# Checking if validations are passed for wasUsername and wasPasswords.
{{- if (eq (include "hcl-dx-deployment.isCustomRemoteSearchSecretUsed" .) "false") }}
# Comparing the  currently set value with the previous credentials. If its equal the previous values remain the same, else previous value is updated with the current credentials
  {{-  if (and (eq $wasActiveUsername (.Values.security.remoteSearch.wasUser | b64enc | b64enc)) (eq $wasActivePassword (.Values.security.remoteSearch.wasPassword | b64enc | b64enc)))}}
    {{- $username = $wasPreviousUsername }}
    {{- $password = $wasPreviousPassword }}
  {{- else }}
    {{- $username = $wasActiveUsername }}
    {{- $password = $wasActivePassword }}
  {{- end }}
{{- else }}
# Comparing the credentials stored in the custom secrets with the previous credentials. If its equal the previous values remain the same, else previous value is updated with the current credentials
  {{- $futureCustomSecret := (lookup "v1" "Secret" .Release.Namespace .Values.security.remoteSearch.customWasSecret) }}
  {{- if (and (eq $wasActiveUsername ((index $futureCustomSecret.data "username") | b64enc)) (eq $wasActivePassword ((index $futureCustomSecret.data "password") | b64enc)))}}
    {{- $username = $wasPreviousUsername }}
    {{- $password = $wasPreviousPassword }}
  {{- else }}
    {{- $username = $wasActiveUsername }}
    {{- $password = $wasActivePassword }}
  {{- end }}
{{- end }}

# Creating a secret to store the updated previous values
apiVersion: "v1"
kind: "Secret"
data:
  username: "{{$username}}"
  password: "{{$password}}"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-remote-search-was-previous-value"
type: "Opaque"

{{- end }}
# This template creates:
# Resources: Secret for push admin user
# For Service: Search Middleware

{{- if eq (include "hcl-dx-deployment.damIndexingEnabled" .) "true" }}

# Initialize all variables with the default value
{{- $username := "" -}}
{{- $password := "" -}}

# Check if a custom secret is used and validate secret name and data
{{- if (eq (include "hcl-dx-deployment.isCustomPushAdminSecretUsed" .) "false") }}
  # Use  credential from values
  {{- $username = .Values.configuration.searchMiddleware.pushAdminUser | b64enc }}
  {{- $password = .Values.configuration.searchMiddleware.pushAdminPassword | b64enc }}
{{- else }}
  # Lookup the credentials in the custom secret
  {{- $adminCustomSecret := (lookup "v1" "Secret" .Release.Namespace (.Values.configuration.searchMiddleware.customPushAdminSecret)) }}
  {{- if $adminCustomSecret }}
    {{- $username = (index $adminCustomSecret.data "username") }}
    {{- $password = (index $adminCustomSecret.data "password") }}
  {{- end -}}
{{- end }}

apiVersion: "v1"
kind: "Secret"
data:
  username: "{{$username}}"
  password: "{{$password}}"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-dam-search-middleware-push-admin"
type: "Opaque"

{{- end }}
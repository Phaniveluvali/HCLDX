# This template creates:
# Resources: PersistentVolumeClaim
# For Service: Digital Asset Management

# Only deploy if Digital Asset Management is enabled
{{- if eq (include "hcl-dx-deployment.digitalAssetManagementEnabled" .) "true" }}

kind: "PersistentVolumeClaim"
apiVersion: "v1"
metadata:
  name: "{{ .Release.Name }}-digital-asset-management"
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
spec:
  accessModes:
    - "ReadWriteMany"
  resources:
    requests:
      storage: "{{ .Values.volumes.digitalAssetManagement.binaries.requests.storage }}"
  storageClassName: "{{- include "hcl-dx-deployment.damStorageClassName" . }}"
  {{ if .Values.volumes.digitalAssetManagement.binaries.selector }}
  selector: {{- toYaml (.Values.volumes.digitalAssetManagement.binaries.selector) | nindent 4 }}
  {{ end }}
  {{ if .Values.volumes.digitalAssetManagement.binaries.volumeName }}
  volumeName: "{{ .Values.volumes.digitalAssetManagement.binaries.volumeName }}"
  {{ end }}

{{- end }}
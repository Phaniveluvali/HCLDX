# This template creates:
# Resources: ServiceMonitor
# For Service: HAProxy

{{- if and (eq (include "hcl-dx-deployment.haproxyEnabled" .) "true") (.Values.metrics.haproxy.scrape) (eq (.Values.metrics.haproxy.prometheusDiscoveryType) "serviceMonitor")}}

apiVersion: "monitoring.coreos.com/v1"
kind: "ServiceMonitor"
metadata:
  name: "{{ .Release.Name }}-haproxy"
  labels:
    app: "{{ .Release.Name }}-haproxy"
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-haproxy"
  endpoints:
    - targetPort: {{ include "hcl-dx-deployment.ports.haproxy.metrics" . }}
      path: /metrics

{{- end }}

# This template creates:
# Resources: Service
# For Service: License Manager

{{- if eq (include "hcl-dx-deployment.licenseManagerEnabled" .) "true" }}

apiVersion: "v1"
kind: "Service"
metadata:
  name: "{{ .Release.Name }}-license-manager"
  annotations: 
  {{- if (.Values.annotations.service.licenseManager) }}
  {{- range $customAnnotationValue := .Values.annotations.service.licenseManager }}
    {{ $customAnnotationValue.key }} : {{ $customAnnotationValue.value | quote }}
  {{- end }}
  {{- end }}
  labels:
    app: "{{ .Release.Name }}-license-manager"
  {{- if (.Values.labels.service.licenseManager) }}
  {{- range $customLabelValue := .Values.labels.service.licenseManager }}
    {{ $customLabelValue.key }} : {{ $customLabelValue.value | quote }}
  {{- end }}
  {{- end }}
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
spec:
  type: "ClusterIP"
  ports:
    - name: "license-manager"
      port: {{ include "hcl-dx-deployment.ports.licenseManager.serverContainerPort" . }}
  selector:
    app: "{{ .Release.Name }}-license-manager"

{{- end }}
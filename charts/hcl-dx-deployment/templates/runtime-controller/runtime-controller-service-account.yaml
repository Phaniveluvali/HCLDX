# This template creates:
# Resources: Service Account
# For Service: runtime-controller

{{- if eq (include "hcl-dx-deployment.runtimeControllerEnabled" .) "true" }}

apiVersion: "v1"
kind: "ServiceAccount"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-runtime-controller-{{ .Release.Namespace }}"

{{- if not (empty (include "hcl-dx-deployment.serviceAccountName" .)) -}}
# This logic only applies for AWS Marketplace deployments
  # Add imagePullSecret if it is explicitly defined in the values.yaml
  {{- if .Values.configuration.runtimeController.awsMpPullSecret }}
imagePullSecrets:
  - name: {{ .Values.configuration.runtimeController.awsMpPullSecret }}
  {{- else }}
    # If the imagePullSecret is not explictily defined in the values, lookup the ServiceAccount used for AWS Marketplace deployments 
    {{- $awsMpServiceAccount := (lookup "v1" "ServiceAccount" .Release.Namespace (include "hcl-dx-deployment.serviceAccountName" .)) }}
    {{- if $awsMpServiceAccount }}
      {{- if $awsMpServiceAccount.imagePullSecrets }}
      # If the ServiceAccount is found and has imagePullSecrets, use the imagePullSecrets from the ServiceAccount
imagePullSecrets:
        {{- range $index, $imagePullSecret := $awsMpServiceAccount.imagePullSecrets }}
  - name: {{ $imagePullSecret.name }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}

{{- end }}
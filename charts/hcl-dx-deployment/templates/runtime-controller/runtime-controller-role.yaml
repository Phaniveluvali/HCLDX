# This template creates:
# Resources: Role
# For Service: runtime-controller

{{- if eq (include "hcl-dx-deployment.runtimeControllerEnabled" .) "true" }}

apiVersion: "rbac.authorization.k8s.io/v1"
kind: "Role"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-runtime-controller-{{ .Release.Namespace }}"
rules:
# ConfigMap access is used to read log level configuration and to store the DB state
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
# Deployment access is used to monitor the persistence layer
- apiGroups:
  - "apps"
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
  - update
# StatefulSet access is used to monitor the persistence layer
- apiGroups:
  - "apps"
  resources:
  - statefulsets
  verbs:
  - get
  - list
  - watch
  - update
# Services access is used to perform checks for traffic routing to the RTC
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - list
  - watch
  - update
# Endpoints are used to control traffic flow going to the RTC leader
- apiGroups:
  - ""
  resources:
  - endpoints
  verbs:
  - get
  - list
  - watch
  - update
  - create
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
# This is needed by RTC to validate credentials using Kubectl Exec and perform actions in the persistence layer
- apiGroups:
  - ""
  resources:
  - pods/exec
  verbs:
  - get
  - create
  - update
# This is needed by RTC to verify admin username through secret
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - update
  - patch 
  - create
  - list
# Used to perform and persist leader election within the RTC
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
# Used to manage the EndpointSlices for RTC routing
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - delete
# Used to access the previously configured replica settings of the persistence layer via ControllerRevisions
- apiGroups:
  - apps
  resources:
  - controllerrevisions
  verbs:
  - get
  - list
  - watch
{{- if eq (include "hcl-dx-deployment.isOpenShift" .) "true" }}
# OpenShift specific access to create restricted endpoints for RTC leader
- apiGroups:
  - ""
  resources:
  - "endpoints/restricted"
  verbs:
  - create
{{- end }}
{{- end }}

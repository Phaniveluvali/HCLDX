# This template creates:
# Resources: Secret for Config Wizard user
# For Service: Core

{{- if and (eq (include "hcl-dx-deployment.coreEnabled" .) "true") .Values.configuration.core.tuning.configWizard }}

# Initialize all variables with the default value
{{- $default := "" -}}
{{- $username := $default -}}
{{- $password := $default -}}

# Check if a custom secret is used and validate secret name and data
{{- if (eq (include "hcl-dx-deployment.isCustomConfigWizardSecretUsed" .) "false") }}
  {{- if and (.Values.security.core.configWizardUser) (.Values.security.core.configWizardPassword) }}
    # Use  credential from values
    {{- $username = .Values.security.core.configWizardUser | b64enc | b64enc }}
    {{- $password = .Values.security.core.configWizardPassword | b64enc | b64enc }}
  # This is only applicable in case of install
  {{- else if and ( .Release.IsInstall) (.Values.security.core.configWizardUser) (not .Values.security.core.configWizardPassword) }}
    {{- $username = .Values.security.core.wasUser | b64enc | b64enc }}
    {{- $password = include "hcl-dx-deployment.generateRandomPassword" (dict "length" 25) | b64enc | b64enc  }}
  {{- else -}}
    {{- $coreConfigwizardSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-core-configwizard" .Release.Name)) }}
    {{- if $coreConfigwizardSecret }}
      {{- $username = (index $coreConfigwizardSecret.data "username") }}
      {{- $password = (index $coreConfigwizardSecret.data "password") }}
    {{- end -}}
  {{- end -}}
{{- else }}
  # Lookup the credentials in the custom secret
  {{- $configWizardCustomSecret := (lookup "v1" "Secret" .Release.Namespace (.Values.security.core.customConfigWizardSecret)) }}
  {{- if $configWizardCustomSecret }}
    {{- $username = (index $configWizardCustomSecret.data "username") | b64enc }}
    {{- $password = (index $configWizardCustomSecret.data "password") | b64enc }}
  {{- end -}}
{{- end }}

apiVersion: "v1"
kind: "Secret"
data:
  username: "{{$username}}"
  password: "{{$password}}"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-core-configwizard"
type: "Opaque"

{{- if .Values.global.sofySandboxContext }}
# This secret is used only for SoFy sandboxes. We use it to display the credentials in the SoFy console.
# The credentials must only be base64 encoded once. Therefore here we decode the values once.
---
apiVersion: "v1"
kind: "Secret"
data:
  username: "{{$username | b64dec }}"
  password: "{{$password | b64dec }}"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-core-configwizard-sofy"
type: "Opaque"
{{- end }}

{{- end }}
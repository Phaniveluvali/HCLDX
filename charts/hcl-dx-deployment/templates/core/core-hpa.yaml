# This template creates:
# Resources: HorizontalPodAutoscaler
# For Service: core

{{- if eq (include "hcl-dx-deployment.coreEnabled" .) "true" }}
{{- if .Values.scaling.horizontalPodAutoScaler.core.enabled }}
apiVersion: "autoscaling/v2"
kind: "HorizontalPodAutoscaler"
metadata:
  name: "{{ .Release.Name }}-core"
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: "apps/v1"
    kind: "StatefulSet"
    name: "{{ .Release.Name }}-core"
  minReplicas: {{ .Values.scaling.horizontalPodAutoScaler.core.minReplicas }}
  maxReplicas: {{ .Values.scaling.horizontalPodAutoScaler.core.maxReplicas }}
  metrics:
  - type: "Resource"
    resource:
      name: "memory"
      target:
        type: Utilization
        averageUtilization: {{ .Values.scaling.horizontalPodAutoScaler.core.targetMemoryUtilizationPercentage }}
  - type: "Resource"
    resource:
      name: "cpu"
      target:
        type: Utilization
        averageUtilization: {{ .Values.scaling.horizontalPodAutoScaler.core.targetCPUUtilizationPercentage }}

{{- end }}
{{- end }}
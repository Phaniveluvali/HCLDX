# This template creates:
# Resources: Service
# For Service: Core

{{- if eq (include "hcl-dx-deployment.coreEnabled" .) "true" }}

apiVersion: "v1"
kind: "Service"
metadata:
  name: "{{ .Release.Name }}-core-headless"
  annotations: 
  {{- if (.Values.annotations.service.core) }}
  {{- range $customAnnotationValue := .Values.annotations.service.core }}
    {{ $customAnnotationValue.key }} : {{ $customAnnotationValue.value | quote }}
  {{- end }}
  {{- end }}
  labels:
    app: "{{ .Release.Name }}-core-headless"
  {{- if (.Values.labels.service.core) }}
  {{- range $customLabelValue := .Values.labels.service.core }}
    {{ $customLabelValue.key }} : {{ $customLabelValue.value | quote }}
  {{- end }}
  {{- end }}
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
spec:
  type: "ClusterIP"
  clusterIP: "None"
  ports:
    {{- include "hcl-dx-deployment.corePortList" . | nindent 4 }}
  selector:
    app: "{{ .Release.Name }}-core"

{{- end }}
# This template creates:
# Resources: Secret for LDAP configuration
# For Service: Core

{{- if eq (include "hcl-dx-deployment.coreEnabled" .) "true" }}
{{- if eq (include "hcl-dx-deployment.ldapConfigurationEnabled" .) "true" }}

{{- $bindUser := "" -}}
{{- $bindPassword := "" -}}

# We check if the respective custom secret is used either for DX LDAP or an "other" LDAP
{{- if or (and (eq .Values.configuration.core.ldap.type "dx") .Values.security.openLdap.customLdapSecret) (and (eq .Values.configuration.core.ldap.type "other") .Values.configuration.core.ldap.customLdapSecret) }}
  {{- $bindUser = include "hcl-dx-deployment.customSecretLdapConfigurationBindUser" . | b64enc -}}
  {{- $bindPassword = include "hcl-dx-deployment.customSecretLdapConfigurationBindPassword" . | b64enc -}}
{{- else }}
  {{- $bindUser = include "hcl-dx-deployment.ldapConfigurationBindUser" . | b64enc | b64enc -}}
  {{- $bindPassword = include "hcl-dx-deployment.ldapConfigurationBindPassword" . | b64enc | b64enc -}}
{{- end }}

apiVersion: "v1"
kind: "Secret"
data:
  bindUser: "{{$bindUser}}"
  bindPassword: "{{$bindPassword}}"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-core-ldap"
type: "Opaque"

{{- end }}
{{- end }}
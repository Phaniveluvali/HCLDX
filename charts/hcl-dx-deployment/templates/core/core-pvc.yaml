# This template creates:
# Resources: PersistentVolumeClaim
# For Service: Core

{{- if eq (include "hcl-dx-deployment.coreEnabled" .) "true" }}

# Application profile PVC
kind: "PersistentVolumeClaim"
apiVersion: "v1"
metadata:
  name: "{{ .Release.Name }}-core-profile"
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
spec:
  accessModes:
    - "ReadWriteMany"
  resources:
    requests:
      storage: "{{ .Values.volumes.core.profile.requests.storage }}"
  storageClassName: "{{- include "hcl-dx-deployment.coreStorageClassName" . }}"
  {{ if .Values.volumes.core.profile.selector }}
  selector: {{- toYaml (.Values.volumes.core.profile.selector) | nindent 4 }}
  {{ end }}
  {{ if .Values.volumes.core.profile.volumeName }}
  volumeName: "{{ .Values.volumes.core.profile.volumeName }}"
  {{ end }}

{{- end }}
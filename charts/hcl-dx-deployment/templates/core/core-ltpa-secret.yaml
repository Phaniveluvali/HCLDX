# This template creates:
# Resources: Secret for LTPA configuration
# For Service: Core

{{- if eq (include "hcl-dx-deployment.coreEnabled" .) "true" }}
{{- if .Values.configuration.core.ltpa.enabled }}

{{- $default := "" -}}
{{- $version := $default -}}
{{- $realm := $default -}}
{{- $desKey := $default -}}
{{- $privateKey := $default -}}
{{- $publicKey := $default -}}
{{- $password := $default -}}

# Check if a custom secret is used and validate secret name and data
{{- if (eq (include "hcl-dx-deployment.isCustomLTPASecretUsed" .) "false") }}
  # Use  credential from values
  {{- $version = .Values.configuration.core.ltpa.version | b64enc -}}
  {{- $realm = .Values.configuration.core.ltpa.realm | b64enc -}}
  {{- $desKey = .Values.configuration.core.ltpa.desKey | b64enc -}}
  {{- $privateKey = .Values.configuration.core.ltpa.privateKey | b64enc -}}
  {{- $publicKey = .Values.configuration.core.ltpa.publicKey | b64enc -}}
  {{- $password = .Values.configuration.core.ltpa.password | b64enc | b64enc -}}
{{- else }}
  # Lookup the credentials in the custom secret
  {{- $ltpaCustomSecret := (lookup "v1" "Secret" .Release.Namespace (.Values.configuration.core.ltpa.customLtpaSecret)) }}
  {{- if $ltpaCustomSecret }}
    {{- $version = (index $ltpaCustomSecret.data "ltpa.version") }}
    {{- $realm = (index $ltpaCustomSecret.data "ltpa.realm") }}
    {{- $desKey = (index $ltpaCustomSecret.data "ltpa.desKey") }}
    {{- $privateKey = (index $ltpaCustomSecret.data "ltpa.privateKey") }}
    {{- $publicKey = (index $ltpaCustomSecret.data "ltpa.publicKey") }}
    {{- $password = (index $ltpaCustomSecret.data "ltpa.password") | b64enc }}
  {{- end -}}
{{- end }}

apiVersion: "v1"
kind: "Secret"
data:
  "ltpa.version": "{{$version}}"
  "ltpa.realm": "{{$realm}}"
  "ltpa.desKey": "{{$desKey}}"
  "ltpa.privateKey": "{{$privateKey}}"
  "ltpa.publicKey": "{{$publicKey}}"
  "ltpa.password": "{{$password}}"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-core-ltpa"
type: "Opaque"

{{- end }}
{{- end }}
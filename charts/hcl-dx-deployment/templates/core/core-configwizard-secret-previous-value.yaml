# This template creates:
# Resources: Secret for Config Wizard user with previous values
# For Service: Core

{{- if and (eq (include "hcl-dx-deployment.coreEnabled" .) "true") .Values.configuration.core.tuning.configWizard }}

# The following logic keeps the last credentials stored to use in the password change process

# Initialize all variables with the default value ("wpsadmin"). This covers the first initial startup of core
{{- $default := "wpsadmin" | b64enc | b64enc -}}
{{- $username := $default -}}
{{- $password := $default -}}
{{- $configWizardActiveUsername := $default -}}
{{- $configWizardActivePassword := $default -}}
{{- $configWizardPreviousUsername := $default -}}
{{- $configWizardPreviousPassword := $default -}}

# Lookup the currently set credentials
{{- $configWizardActiveSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-core-configwizard" .Release.Name)) }}
{{- if $configWizardActiveSecret }}
  {{- $configWizardActiveUsername = (index $configWizardActiveSecret.data "username") }}
  {{- $configWizardActivePassword = (index $configWizardActiveSecret.data "password") }}
{{- end -}}

# Lookup the previously set credentials
{{- $configWizardPreviousSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-core-configwizard-previous-value" .Release.Name)) }}
{{- if $configWizardPreviousSecret -}}
  {{- $configWizardPreviousUsername = (index $configWizardPreviousSecret.data "username") }}
  {{- $configWizardPreviousPassword = (index $configWizardPreviousSecret.data "password") }}
{{- end }}

# If the value defined in the custom values is still the same as the currently set values, we keep the previous values the same
# If the values changed, we store the current values in the previous values secret
# This mechanism makes sure that multiple upgrades with the same values do not overwrite the previous credentials

# Checking if validations are passed for configWizardUser and configWizardPassword.
{{- if (eq (include "hcl-dx-deployment.isCustomConfigWizardSecretUsed" .) "false") }}
# Comparing the  currently set value with the previous credentials. If its equal the previous values remain the same, else previous value is updated with the current credentials
  {{-  if (and (eq $configWizardActiveUsername (.Values.security.core.configWizardUser | b64enc | b64enc)) (eq $configWizardActivePassword (.Values.security.core.configWizardPassword | b64enc | b64enc)))}}
    {{- $username = $configWizardPreviousUsername }}
    {{- $password = $configWizardPreviousPassword }}
  {{- else }}
    {{- $username = $configWizardActiveUsername }}
    {{- $password = $configWizardActivePassword }}
  {{- end }}
{{- else }}
# Comparing the credentials stored in the custom secrets with the previous credentials. If its equal the previous values remain the same, else previous value is updated with the current credentials
  {{- $futureCustomSecret := (lookup "v1" "Secret" .Release.Namespace (.Values.security.core.customConfigWizardSecret)) }}
  {{- if (and (eq $configWizardActiveUsername ((index $futureCustomSecret.data "username") | b64enc)) (eq $configWizardActivePassword ((index $futureCustomSecret.data "password") | b64enc)))}}
    {{- $username = $configWizardPreviousUsername }}
    {{- $password = $configWizardPreviousPassword }}
  {{- else }}
    {{- $username = $configWizardActiveUsername }}
    {{- $password = $configWizardActivePassword }}
  {{- end }}
{{- end }}

# Creating a secret to store the updated previous values
apiVersion: "v1"
kind: "Secret"
data:
  username: "{{$username}}"
  password: "{{$password}}"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-core-configwizard-previous-value"
type: "Opaque"

{{- end }}
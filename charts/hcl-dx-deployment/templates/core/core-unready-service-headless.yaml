# This template creates:
# Resources: Service
# For Service: Core

{{- if eq (include "hcl-dx-deployment.coreEnabled" .) "true" }}
{{- if eq (include "hcl-dx-deployment.configureRemoteSearch" .) "true" }}

apiVersion: "v1"
kind: "Service"
metadata:
  name: "{{ .Release.Name }}-core-unready-headless"
spec:
  type: "ClusterIP"
  clusterIP: "None"
  ports:
    {{- include "hcl-dx-deployment.corePortList" . | nindent 4 }}
  publishNotReadyAddresses: true
  selector:
    app: "{{ .Release.Name }}-core"

{{- end }}
{{- end }}
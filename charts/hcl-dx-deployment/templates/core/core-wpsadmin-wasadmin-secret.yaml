# Get generate random password for fresh install
{{- $passwordText := "" -}}
{{- if ( .Release.IsInstall) }} 
  {{- $passwordText = include "hcl-dx-deployment.generateRandomPassword" (dict "length" 25) | b64enc | b64enc }}
{{- end -}}

{{- if eq (include "hcl-dx-deployment.coreEnabled" .) "true" }}
# This template creates:
# Resources: Secret for wasadmin user
# For Service: Core
# Initialize all variables with the default value
{{- $default := "" -}}
{{- $username := $default -}}
{{- $password := $default -}}

# Check if a custom secret is used and validate secret name and data
{{- if (eq (include "hcl-dx-deployment.isCustomWasSecretUsed" .) "false") }}
  {{- if and (.Values.security.core.wasUser) (.Values.security.core.wasPassword) }}
    # Use  credential from values
    {{- $username = .Values.security.core.wasUser | b64enc | b64enc }}
    {{- $password = .Values.security.core.wasPassword | b64enc | b64enc }}
  # This is only applicable in case of install
  {{- else if and ( .Release.IsInstall) (.Values.security.core.wasUser) (not .Values.security.core.wasPassword) }}
    {{- $username = .Values.security.core.wasUser | b64enc | b64enc }}
    {{- $password = $passwordText }}
  {{- else -}}
    {{- $coreWasSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-core-was" .Release.Name)) }}
    {{- if $coreWasSecret }}
      {{- $username = (index $coreWasSecret.data "username") }}
      {{- $password = (index $coreWasSecret.data "password") }}
    {{- end -}}
  {{- end -}}
{{- else }}
  # Lookup the credentials in the custom secret
  {{- $wasCustomSecret := (lookup "v1" "Secret" .Release.Namespace (.Values.security.core.customWasSecret)) }}
  {{- if $wasCustomSecret }}
    {{- $username = (index $wasCustomSecret.data "username") | b64enc }}
    {{- $password = (index $wasCustomSecret.data "password") | b64enc }}
  {{- end -}}
{{- end }}

apiVersion: "v1"
kind: "Secret"
data:
  username: "{{$username}}"
  password: "{{$password}}"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-core-was"
type: "Opaque"

{{- end }}
{{- if or (eq (include "hcl-dx-deployment.coreEnabled" .) "true") (eq (include "hcl-dx-deployment.digitalAssetManagementEnabled" .) "true") }}
---
# This template creates:
# Resources: Secret for wpsadmin user
# For Service: Core
# Initialize all variables with the default value
{{- $default := "" -}}
{{- $username := $default -}}
{{- $password := $default -}}

# Check if a custom secret is used and validate secret name and data
{{- if (eq (include "hcl-dx-deployment.isCustomWpsSecretUsed" .) "false") }}
  {{- if and (.Values.security.core.wpsUser) (.Values.security.core.wpsPassword) }}
    # Use  credential from values
    {{- $username = .Values.security.core.wpsUser | b64enc | b64enc }}
    {{- $password = .Values.security.core.wpsPassword | b64enc | b64enc }}
  # This is only applicable in case of install
  {{- else if and ( .Release.IsInstall) (.Values.security.core.wpsUser) (not .Values.security.core.wpsPassword) }}
    {{- $username = .Values.security.core.wpsUser | b64enc | b64enc }}
    {{- $password = $passwordText }}
  {{- else -}}
    {{- $coreWpsSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-core-wps" .Release.Name)) }}
    {{- if $coreWpsSecret }}
      {{- $username = (index $coreWpsSecret.data "username") }}
      {{- $password = (index $coreWpsSecret.data "password") }}
    {{- end -}}
  {{- end -}}
  {{- else }}
  # Lookup the credentials in the custom secret
  {{- $wpsCustomSecret := (lookup "v1" "Secret" .Release.Namespace (.Values.security.core.customWpsSecret)) }}
  {{- if $wpsCustomSecret }}
    {{- $username = (index $wpsCustomSecret.data "username") | b64enc }}
    {{- $password = (index $wpsCustomSecret.data "password") | b64enc }}
  {{- end -}}
{{- end }}

apiVersion: "v1"
kind: "Secret"
data:
  username: "{{$username}}"
  password: "{{$password}}"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-core-wps"
type: "Opaque"

{{- if .Values.global.sofySandboxContext }}
# This secret is used only for SoFy sandboxes. We use it to display the credentials in the SoFy console.
# The credentials must only be base64 encoded once. Therefore here we decode the values once.
---
apiVersion: "v1"
kind: "Secret"
data:
  username: "{{$username | b64dec }}"
  password: "{{$password | b64dec }}"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-core-wps-sofy"
type: "Opaque"
{{- end }}

{{- end }}
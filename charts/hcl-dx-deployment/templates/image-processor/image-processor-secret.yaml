# This template creates:
# Resources: Secret for Image processor plugin API
# For Service: image-processor

{{- if eq (include "hcl-dx-deployment.imageProcessorEnabled" .) "true" }}

# Initialize all variables with the default value
{{- $authKey := "" -}}

# Check if a custom secret is used and validate secret name and data
{{- if (eq (include "hcl-dx-deployment.isCustomImageProcessorSecretUsed" .) "false") }}
  # Use  credential from values
  {{- $authKey = .Values.security.imageProcessor.authenticationKey | b64enc }}
{{- else }}
  # Lookup the credentials in the custom secret
  {{- $imageProcessorCustomSecret := (lookup "v1" "Secret" .Release.Namespace (.Values.security.imageProcessor.customImageProcessorSecret)) }}
  {{- if $imageProcessorCustomSecret }}
    {{- $authKey = (index $imageProcessorCustomSecret.data "authenticationKey") }}
  {{- end -}}
{{- end }}

apiVersion: "v1"
kind: "Secret"
data:
  authenticationKey: "{{$authKey}}"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-image-processor-authentication"
type: "Opaque"
{{- end }}
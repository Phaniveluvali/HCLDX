# This template creates:
# Resources: Secret for persistence user
# For Service: persistence

{{- if eq (include "hcl-dx-deployment.persistenceEnabled" .) "true" }}

# Initialize all variables with the default value
{{- $username := "" -}}
{{- $password := "" -}}

# Check if a custom secret is used and validate secret name and data
{{- if (eq (include "hcl-dx-deployment.isCustomConnectionPoolSecretUsed" .) "false") }}
  # Use  credential from values
  {{- $username = .Values.security.persistence.connectionPoolAdmin | b64enc }}
  {{- $password = .Values.security.persistence.connectionPoolPassword | b64enc }}
{{- else }}
  # Lookup the credentials in the custom secret
  {{- $connectionPoolCustomSecret := (lookup "v1" "Secret" .Release.Namespace (.Values.security.persistence.customConnectionPoolSecret)) }}
  {{- if $connectionPoolCustomSecret }}
    {{- $username = (index $connectionPoolCustomSecret.data "username") }}
    {{- $password = (index $connectionPoolCustomSecret.data "password") }}
  {{- end -}}
{{- end }}

apiVersion: "v1"
kind: "Secret"
data:
  username: "{{$username}}"
  password: "{{$password}}"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-persistence-connection-pool-admin"
type: "Opaque"

{{- end }}
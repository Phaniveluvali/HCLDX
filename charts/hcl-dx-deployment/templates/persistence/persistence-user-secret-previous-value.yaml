# This template creates:
# Resources: Secret for persistence user
# For Service: persistence

{{- if eq (include "hcl-dx-deployment.persistenceEnabled" .) "true" }}

# The following logic keeps the last credentials stored to use in the password change process

# Initialize all variables with the default value
{{- $username := "" -}}
{{- $password := "" -}}
{{- $dbActiveUsername := "" -}}
{{- $dbActivePassword := "" -}}
{{- $dbPreviousUsername := "" -}}
{{- $dbPreviousPassword := "" -}}

# Lookup the currently set credentials
{{- $dbSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-persistence-user" .Release.Name)) }}
{{- if $dbSecret }}
  {{- $dbActiveUsername = (index $dbSecret.data "username") }}
  {{- $dbActivePassword = (index $dbSecret.data "password") }}
{{- end -}}

# Lookup the previously set credentials
{{- $dbPreviousSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-persistence-user-previous-value" .Release.Name)) }}
{{- if $dbPreviousSecret -}}
  {{- $dbPreviousUsername = (index $dbPreviousSecret.data "username") }}
  {{- $dbPreviousPassword = (index $dbPreviousSecret.data "password") }}
{{- end }}

# If the value defined in the custom values is still the same as the currently set values, we keep the previous values the same
# If the values changed, we store the current values in the previous values secret
# This mechanism makes sure that multiple upgrades with the same values do not overwrite the previous credentials

# Checking if validations are passed for DB user name and DB passwords.
{{- if (eq (include "hcl-dx-deployment.isCustomDBSecretUsed" .) "false") }}
# Comparing the  currently set value with the previous credentials. If its equal the previous values remain the same, else previous value is updated with the current credentials
  {{-  if (and (eq $dbActiveUsername (.Values.security.digitalAssetManagement.dbUser | b64enc | b64enc)) (eq $dbActivePassword (.Values.security.digitalAssetManagement.dbPassword | b64enc | b64enc)))}}
    {{- $username = $dbPreviousUsername }}
    {{- $password = $dbPreviousPassword }}
  {{- else }}
    {{- $username = $dbActiveUsername }}
    {{- $password = $dbActivePassword }}
  {{- end }}
{{- else }}
# Comparing the credentials stored in the custom secrets with the previous credentials. If its equal the previous values remain the same, else previous value is updated with the current credentials
  {{- $futureCustomSecret := (lookup "v1" "Secret" .Release.Namespace (.Values.security.digitalAssetManagement.customDBSecret)) }}
  {{- if (and (eq $dbActiveUsername ((index $futureCustomSecret.data "username") | b64enc)) (eq $dbActivePassword ((index $futureCustomSecret.data "password") | b64enc)))}}
    {{- $username = $dbPreviousUsername }}
    {{- $password = $dbPreviousPassword }}
  {{- else }}
    {{- $username = $dbActiveUsername }}
    {{- $password = $dbActivePassword }}
  {{- end }}
{{- end }}

# Creating a secret to store the updated previous values
apiVersion: "v1"
kind: "Secret"
data:
  username: "{{$username}}"
  password: "{{$password}}"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-persistence-user-previous-value"
type: "Opaque"

{{- end }}
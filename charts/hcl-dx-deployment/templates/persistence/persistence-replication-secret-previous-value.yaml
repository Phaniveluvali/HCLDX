# This template creates:
# Resources: Secret for persistence replication user
# For Service: persistence

{{- if eq (include "hcl-dx-deployment.persistenceEnabled" .) "true" }}

# The following logic keeps the last credentials stored to use in the password change process

# Initialize all variables with the default value
{{- $username := "" -}}
{{- $password := "" -}}
{{- $replicationActiveUsername := "" -}}
{{- $replicationActivePassword := "" -}}
{{- $replicationPreviousUsername := "" -}}
{{- $replicationPreviousPassword := "" -}}

# Lookup the currently set credentials
{{- $replicationSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-persistence-replication" .Release.Name)) }}
{{- if $replicationSecret }}
  {{- $replicationActiveUsername = (index $replicationSecret.data "username") }}
  {{- $replicationActivePassword = (index $replicationSecret.data "password") }}
{{- end -}}

# Lookup the previously set credentials
{{- $replicationPreviousSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-persistence-replication-previous-value" .Release.Name)) }}
{{- if $replicationPreviousSecret -}}
  {{- $replicationPreviousUsername = (index $replicationPreviousSecret.data "username") }}
  {{- $replicationPreviousPassword = (index $replicationPreviousSecret.data "password") }}
{{- end }}

# If the value defined in the custom values is still the same as the currently set values, we keep the previous values the same
# If the values changed, we store the current values in the previous values secret
# This mechanism makes sure that multiple upgrades with the same values do not overwrite the previous credentials

# Checking if validations are passed for DB user name and DB passwords.
{{- if (eq (include "hcl-dx-deployment.isCustomReplicationSecretUsed" .) "false") }}
# Comparing the  currently set value with the previous credentials. If its equal the previous values remain the same, else previous value is updated with the current credentials
  {{-  if (and (eq $replicationActiveUsername (.Values.security.digitalAssetManagement.replicationUser | b64enc | b64enc)) (eq $replicationActivePassword (.Values.security.digitalAssetManagement.replicationPassword | b64enc | b64enc)))}}
    {{- $username = $replicationPreviousUsername }}
    {{- $password = $replicationPreviousPassword }}
  {{- else }}
    {{- $username = $replicationActiveUsername }}
    {{- $password = $replicationActivePassword }}
  {{- end }}
{{- else }}
# Comparing the credentials stored in the custom secrets with the previous credentials. If its equal the previous values remain the same, else previous value is updated with the current credentials
  {{- $futureCustomSecret := (lookup "v1" "Secret" .Release.Namespace (.Values.security.digitalAssetManagement.customReplicationSecret)) }}
  {{- if (and (eq $replicationActiveUsername ((index $futureCustomSecret.data "username") | b64enc)) (eq $replicationActivePassword ((index $futureCustomSecret.data "password") | b64enc)))}}
    {{- $username = $replicationPreviousUsername }}
    {{- $password = $replicationPreviousPassword }}
  {{- else }}
    {{- $username = $replicationActiveUsername }}
    {{- $password = $replicationActivePassword }}
  {{- end }}
{{- end }}

# Creating a secret to store the updated previous values
apiVersion: "v1"
kind: "Secret"
data:
  username: "{{$username}}"
  password: "{{$password}}"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-persistence-replication-previous-value"
type: "Opaque"

{{- end }}
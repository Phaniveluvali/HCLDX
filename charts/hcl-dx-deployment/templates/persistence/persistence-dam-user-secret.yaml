# This template creates:
# Resources: Secret for persistence user
# For Service: persistence

{{- if or (eq (include "hcl-dx-deployment.persistenceEnabled" .) "true") (and (.Values.configuration.persistence.host) (ne .Values.configuration.persistence.host "")) }}

# Initialize all variables with the default value
{{- $username := "" -}}
{{- $password := "" -}}

# Check if a custom secret is used and validate secret name and data
{{- if (eq (include "hcl-dx-deployment.isCustomDamSecretUsed" .) "false") }}
  # Use  credential from values
  {{- $username = .Values.security.digitalAssetManagement.damUser | b64enc }}
  {{- $password = .Values.security.digitalAssetManagement.damPassword | b64enc }}
{{- else }}
  # Lookup the credentials in the custom secret
  {{- $damCustomSecret := (lookup "v1" "Secret" .Release.Namespace (.Values.security.digitalAssetManagement.customDamSecret)) }}
  {{- if $damCustomSecret }}
    {{- $username = (index $damCustomSecret.data "username") }}
    {{- $password = (index $damCustomSecret.data "password") }}
  {{- end -}}
{{- end }}

apiVersion: "v1"
kind: "Secret"
data:
  username: "{{$username}}"
  password: "{{$password}}"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-persistence-dam-user"
type: "Opaque"
{{- end }}
# This template creates:
# Resources: Secret for persistence user
# For Service: persistence

{{- if or (eq (include "hcl-dx-deployment.persistenceEnabled" .) "true") (and (.Values.configuration.persistence.host) (ne .Values.configuration.persistence.host "")) }}

# The following logic keeps the last credentials stored to use in the password change process

# Initialize all variables with the default value
{{- $username := "" -}}
{{- $password := "" -}}
{{- $damActiveUsername := "" -}}
{{- $damActivePassword := "" -}}
{{- $damPreviousUsername := "" -}}
{{- $damPreviousPassword := "" -}}

# Lookup the currently set credentials
{{- $damSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-persistence-dam-user" .Release.Name)) }}
{{- if $damSecret }}
  {{- $damActiveUsername = (index $damSecret.data "username") }}
  {{- $damActivePassword = (index $damSecret.data "password") }}
{{- end -}}

# Lookup the previously set credentials
{{- $damPreviousSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-persistence-dam-user-previous-value" .Release.Name)) }}
{{- if $damPreviousSecret -}}
  {{- $damPreviousUsername = (index $damPreviousSecret.data "username") }}
  {{- $damPreviousPassword = (index $damPreviousSecret.data "password") }}
{{- end }}

# If the value defined in the custom values is still the same as the currently set values, we keep the previous values the same
# If the values changed, we store the current values in the previous values secret
# This mechanism makes sure that multiple upgrades with the same values do not overwrite the previous credentials

# Checking if validations are passed for dam user name and dam passwords.
{{- if (eq (include "hcl-dx-deployment.isCustomDamSecretUsed" .) "false") }}
# Comparing the  currently set value with the previous credentials. If its equal the previous values remain the same, else previous value is updated with the current credentials
  {{-  if (and (eq $damActiveUsername (.Values.security.digitalAssetManagement.damUser | b64enc | b64enc)) (eq $damActivePassword (.Values.security.digitalAssetManagement.damPassword | b64enc | b64enc)))}}
    {{- $username = $damPreviousUsername }}
    {{- $password = $damPreviousPassword }}
  {{- else }}
    {{- $username = $damActiveUsername }}
    {{- $password = $damActivePassword }}
  {{- end }}
{{- else }}
# Comparing the credentials stored in the custom secrets with the previous credentials. If its equal the previous values remain the same, else previous value is updated with the current credentials
  {{- $futureCustomSecret := (lookup "v1" "Secret" .Release.Namespace (.Values.security.digitalAssetManagement.customDamSecret)) }}
  {{- if (and (eq $damActiveUsername ((index $futureCustomSecret.data "username") | b64enc)) (eq $damActivePassword ((index $futureCustomSecret.data "password") | b64enc)))}}
    {{- $username = $damPreviousUsername }}
    {{- $password = $damPreviousPassword }}
  {{- else }}
    {{- $username = $damActiveUsername }}
    {{- $password = $damActivePassword }}
  {{- end }}
{{- end }}

# Creating a secret to store the updated previous values
apiVersion: "v1"
kind: "Secret"
data:
  username: "{{$username}}"
  password: "{{$password}}"
metadata:
  labels:
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
  name: "{{ .Release.Name }}-persistence-dam-user-previous-value"
type: "Opaque"

{{- end }}
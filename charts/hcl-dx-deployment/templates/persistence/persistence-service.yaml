# This template creates:
# Resources: Service
# For Service: persistence

{{- if eq (include "hcl-dx-deployment.persistenceEnabled" .) "true" }}

apiVersion: "v1"
kind: "Service"
metadata:
  name: "{{ .Release.Name }}-persistence"
  labels:
    app: "{{ .Release.Name }}-persistence"
    # Using general labels, see _deployment_helpers.tpl
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
spec:
  type: "ClusterIP"
  ports:
    - name: "persistence"
      port: {{ include "hcl-dx-deployment.ports.persistence.pgpool" . }}
  selector:
    app: "{{ .Release.Name }}-persistence-connection-pool"
        
{{- end }}
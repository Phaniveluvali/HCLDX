{{- /* This template creates the IQ DB secret automatically if a custom one isn't provided in values.yaml
    Note: values.schema.json enforces that either dbUser+dbPassword OR customDbSecret is provided (validated via oneOf)
    Secret is only created when:
    1. Persistence is enabled (required for IQ database)
    2. IQ is actually enabled (dxIqService is configured)
    3. Custom DB secret is not provided
*/ -}}
{{- if and (eq (include "hcl-dx-deployment.persistenceEnabled" .) "true") (eq (include "hcl-dx-deployment.iqEnabled" .) "true") (not .Values.incubator.security.iq.customDbSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-iq-db-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
type: Opaque
data:
  # These keys "username" and "password" must match exactly what your Java code looks for
  username: {{ .Values.incubator.security.iq.dbUser | b64enc }}
  password: {{ .Values.incubator.security.iq.dbPassword | b64enc }}
{{- end }}

# This Secret contains shared configuration for the Core application.
# It is only created if both enableConfigurationSharing and hcl-dx-deployment.coreEnabled are true.
# Other products (LEAP, MX, etc.) can mount this Secret to consume DX LTPA keys and OIDC configuration.
{{- if and .Values.incubator.enableConfigurationSharing (eq (include "hcl-dx-deployment.coreEnabled" .) "true") }}

{{- $default := "" -}}
{{- $version := $default -}}
{{- $realm := $default -}}
{{- $desKey := $default -}}
{{- $privateKey := $default -}}
{{- $publicKey := $default -}}
{{- $password := $default -}}

# Check if LTPA is enabled and populate LTPA keys
{{- if .Values.configuration.core.ltpa.enabled }}
  {{- if (eq (include "hcl-dx-deployment.isCustomLTPASecretUsed" .) "false") }}
    # Use credential from values
    {{- $version = .Values.configuration.core.ltpa.version -}}
    {{- $realm = .Values.configuration.core.ltpa.realm -}}
    {{- $desKey = .Values.configuration.core.ltpa.desKey -}}
    {{- $privateKey = .Values.configuration.core.ltpa.privateKey -}}
    {{- $publicKey = .Values.configuration.core.ltpa.publicKey -}}
    {{- $password = .Values.configuration.core.ltpa.password -}}
  {{- else }}
    # Lookup the credentials in the custom secret
    {{- $ltpaCustomSecret := (lookup "v1" "Secret" .Release.Namespace (.Values.configuration.core.ltpa.customLtpaSecret)) }}
    {{- if $ltpaCustomSecret }}
      {{- $version = (index $ltpaCustomSecret.data "ltpa.version") | b64dec -}}
      {{- $realm = (index $ltpaCustomSecret.data "ltpa.realm") | b64dec -}}
      {{- $desKey = (index $ltpaCustomSecret.data "ltpa.desKey") | b64dec -}}
      {{- $privateKey = (index $ltpaCustomSecret.data "ltpa.privateKey") | b64dec -}}
      {{- $publicKey = (index $ltpaCustomSecret.data "ltpa.publicKey") | b64dec -}}
      {{- $password = (index $ltpaCustomSecret.data "ltpa.password") | b64dec -}}
    {{- end -}}
  {{- end }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: dx-shared-config-v1
  labels:
    app: "{{ .Release.Name }}-core"
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
type: Opaque
stringData:
  # LTPA configuration for Core (for SSO integration with LEAP, MX, etc.)
  {{- if .Values.configuration.core.ltpa.enabled }}
  ltpa.version: {{ $version | quote }}
  ltpa.realm: {{ $realm | quote }}
  ltpa.desKey: {{ $desKey | quote }}
  ltpa.privateKey: {{ $privateKey | quote }}
  ltpa.publicKey: {{ $publicKey | quote }}
  ltpa.password: {{ $password | quote }}
  {{- end }}
{{- end }}

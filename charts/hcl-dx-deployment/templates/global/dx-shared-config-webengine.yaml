# This Secret contains shared configuration for the WebEngine application.
# It is only created if both enableConfigurationSharing and hcl-dx-deployment.webEngineEnabled are true.
# Other products (LEAP, MX, etc.) can mount this Secret to consume DX LTPA keys and OIDC configuration.
{{- if and .Values.incubator.enableConfigurationSharing (eq (include "hcl-dx-deployment.webEngineEnabled" .) "true") }}

{{- $ltpaPassword := "" -}}
{{- $ltpaKeysContent := "" -}}

# Check if LTPA is enabled and populate LTPA keys
{{- if .Values.configuration.webEngine.ltpa.customLtpaSecret }}
  # Lookup the LTPA secret
  {{- $ltpaCustomSecret := (lookup "v1" "Secret" .Release.Namespace (.Values.configuration.webEngine.ltpa.customLtpaSecret)) }}
  {{- if $ltpaCustomSecret }}
    {{- $ltpaKeysContent = (index $ltpaCustomSecret.data "ltpa.keys") | b64dec -}}
    {{- $ltpaPassword = (index $ltpaCustomSecret.data "password") | b64dec -}}
  {{- end -}}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: dx-shared-config-v1
  labels:
    app: "{{ .Release.Name }}-web-engine"
    {{- include "hcl-dx-deployment.labels" . | nindent 4 }}
type: Opaque
stringData:
  # LTPA configuration for WebEngine (for SSO integration with LEAP, MX, etc.)
  {{- if and $ltpaKeysContent $ltpaPassword }}
  ltpa.keys: |
{{ $ltpaKeysContent | indent 4 }}
  ltpa.keys.password: "{{ $ltpaPassword }}"
  {{- end }}
{{- end }}

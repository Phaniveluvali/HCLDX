# This template creates:
# Resources: HorizontalPodAutoscaler
# For Service: People Service

{{- if .Values.scaling.horizontalPodAutoScaler.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "hcl-people-service.fullname" . }}
  labels:
    {{- include "hcl-people-service.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "hcl-people-service.fullname" . }}
  minReplicas: {{ .Values.scaling.horizontalPodAutoScaler.minReplicas }}
  maxReplicas: {{ .Values.scaling.horizontalPodAutoScaler.maxReplicas }}
  metrics:
  - type: "Resource"
    resource:
      name: "memory"
      target:
        type: Utilization
        averageUtilization: {{ .Values.scaling.horizontalPodAutoScaler.targetMemoryUtilizationPercentage }}
  - type: "Resource"
    resource:
      name: "cpu"
      target:
        type: Utilization
        averageUtilization: {{ .Values.scaling.horizontalPodAutoScaler.targetCPUUtilizationPercentage }}
{{- end }}

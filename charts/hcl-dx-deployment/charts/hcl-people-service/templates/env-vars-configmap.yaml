# This template creates:
# Resources: ConfigMap
# For Service: People Service

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-env-vars-configmap" (include "hcl-people-service.fullname" .) }}
  labels:
    app: {{ include "hcl-people-service.fullname" . }}
    {{- include "hcl-people-service.labels" . | nindent 4 }}
data:
  {{- include "hcl-people-service.envVars" . | nindent 2 }}

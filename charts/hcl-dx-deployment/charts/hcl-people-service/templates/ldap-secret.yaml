# This template creates:
# Resources: Secret
# For Service: People Service

{{- if and (include "hcl-people-service.createLdapSecret" .) (include "hcl-people-service.ldapSecretData" .) }}
{{- include "hcl-people-service.validateLdapValues" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hcl-people-service.ldapSecretName" . }}
  annotations: 
  {{- if (.Values.annotations.pod) }}
  {{- range $customAnnotationValue := .Values.annotations.pod }}
    {{ $customAnnotationValue.key }}: {{ $customAnnotationValue.value | quote }}
  {{- end }}
  {{- end }}  
  labels:
    app: {{ include "hcl-people-service.fullname" . }}
    {{- include "hcl-people-service.labels" . | nindent 4 }}
type: Opaque
data:
  {{- include "hcl-people-service.ldapSecretData" . | nindent 2 }}
{{- end }}

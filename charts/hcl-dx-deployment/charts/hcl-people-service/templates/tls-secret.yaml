{{- if and .Values.networking.ingress.enabled (not .Values.networking.ingress.existingSecret) .Values.networking.ingress.autoGenerateSelfSignedCert }}
{{- $secretName := printf "%s-tls" .Values.networking.host }}
{{- $ca := genCA "people-service-ca" 365 }}
{{- $cert := genSelfSignedCert .Values.networking.host nil nil 365 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app: {{ include "hcl-people-service.fullname" . }}
    {{- include "hcl-people-service.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}

# This template creates:
# Resources: Secret for push admin user
# For Service: Search Middleware

{{- if eq (include "hcl-people-service.searchMiddlewareEnabled" .) "true" }}
{{- if eq (include "hcl-people-service.shouldCreateSearchMiddlewarePushAdminSecret" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hcl-people-service.searchMiddlewarePushAdminSecretName" . }}
  annotations:
  {{- if (.Values.annotations.pod) }}
  {{- range $customAnnotationValue := .Values.annotations.pod }}
    {{ $customAnnotationValue.key }}: {{ $customAnnotationValue.value | quote }}
  {{- end }}
  {{- end }}
  labels:
    app: {{ include "hcl-people-service.fullname" . }}
    {{- include "hcl-people-service.labels" . | nindent 4 }}
type: Opaque
data:
  {{- include "hcl-people-service.searchMiddlewarePushAdminSecretData" . | nindent 2 }}
{{- end }}
{{- end }}

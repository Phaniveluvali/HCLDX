# Small config values for hcl-dx-deployment.
resources:
  # Core resource allocation
  core:
    requests:
      cpu: "3000m"
      memory: "5000Mi"
    limits:
      cpu: "3000m"
      memory: "5000Mi"
  # Ring API resource allocation
  ringApi:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  # HAProxy resource allocation
  haproxy:
    requests:
      cpu: "700m"
      memory: "1024Mi"
    limits:
      cpu: "700m"
      memory: "1024Mi"